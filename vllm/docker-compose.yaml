###
### junand 10.10.2025

x-deploy_nvidia: &deploy_nvidia
    deploy:
        resources:
            reservations:
                devices:
                  - driver: nvidia
                    count: all
                    capabilities:
                      - gpu
                      - utility
                      - compute

networks:
  proxy:
    external: true
  backbone:
    external: true

### https://www.jetson-ai-lab.com/models
### https://www.jetson-ai-lab.com/tutorials/genai-on-jetson-llms-vlms

### https://docs.vllm.ai/en/stable/deployment/docker
### https://catalog.ngc.nvidia.com/orgs/nvidia/-/containers/vllm
### https://docs.nvidia.com/deeplearning/frameworks/vllm-release-notes

### https://github.com/orgs/NVIDIA-AI-IOT/packages

services:

    ### https://huggingface.co/nvidia/Qwen3.6-27B-NVFP4
    ### https://huggingface.co/sakamakismile/Qwen3.6-27B-NVFP4
    ### https://www.jetson-ai-lab.com/models/qwen3-6-27b/
    vllm_qwen36_27b:
        # image: vllm/vllm-openai:v0.26.0-aarch64-ubuntu2404
        image: vllm/vllm-openai:v0.25.1-aarch64-ubuntu2404
        container_name: vllm_qwen36_27b
        restart: unless-stopped
        pull_policy: always
        environment:
          - TZ=Europe/Berlin
          - HF_TOKEN=${HF_TOKEN}
        labels:
          - "traefik.enable=false"
        volumes:
          - ~/docker/vllm/models:/root/.cache/huggingface
          - ~/docker/vllm/cache/qwen36_27b:/root/.cache/vllm
        shm_size: '16gb'
        ports:
          - 8000:8000
        healthcheck:
            test: ["CMD-SHELL", "python3 -c \"import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5)); sys.exit(0 if isinstance(d, dict) and 'data' in d else 1)\" >/dev/null 2>&1 || exit 1"]
            interval: 20s
            timeout: 5s
            retries: 10
            start_period: 20m
        entrypoint: ["bash", "-c"]
        command:
          - >-
            exec vllm serve nvidia/Qwen3.6-27B-NVFP4
            --served-model-name qwen3.6
            --port 8000
            --kv-cache-dtype fp8
            --gpu-memory-utilization 0.6
            --max-model-len 262144
            --max-num-seqs 8
            --max-num-batched-tokens 16384
            --enable-prefix-caching
            --enable-chunked-prefill
            --reasoning-parser qwen3
            --enable-auto-tool-choice
            --tool-call-parser qwen3_xml
            --trust-remote-code
            --speculative-config '{"method": "mtp", "num_speculative_tokens": 3, "moe_backend": "triton"}'
            --quantization compressed-tensors
            --dtype auto
        runtime: nvidia
        << : *deploy_nvidia
        networks:
          - backbone

    ### https://www.jetson-ai-lab.com/models/qwen3-6-35b-a3b/
    ### https://huggingface.co/RedHatAI/Qwen3.6-35B-A3B-NVFP4
    ### https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4
    vllm_qwen36_35b_a3b:
        image: vllm/vllm-openai:v0.27.1-aarch64-ubuntu2404
        container_name: vllm_qwen36_35b_a3b
        restart: unless-stopped
        pull_policy: always
        environment:
          - TZ=Europe/Berlin
          - HF_TOKEN=${HF_TOKEN}
          # - VLLM_MARLIN_USE_ATOMIC_ADD=1
          # - VLLM_NVFP4_GEMM_BACKEND=marlin
          # - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
        labels:
          - "traefik.enable=false"
        volumes:
          - ~/docker/vllm/models:/root/.cache/huggingface
          - ~/docker/vllm/cache/qwen36_35b_a3b:/root/.cache/vllm
        shm_size: '16gb'
        ports:
          - 8000:8000
        healthcheck:
            test: ["CMD-SHELL", "python3 -c \"import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5)); sys.exit(0 if isinstance(d, dict) and 'data' in d else 1)\" >/dev/null 2>&1 || exit 1"]
            interval: 20s
            timeout: 5s
            retries: 10
            start_period: 20m
        entrypoint: ["bash", "-c"]
            # --generation-config vllm
            # --language-model-only
        command:
          - >-
            exec vllm serve nvidia/Qwen3.6-35B-A3B-NVFP4
            --served-model-name qwen3.6
            --port 8000
            --kv-cache-dtype fp8
            --gpu-memory-utilization 0.4
            --max-model-len 262144
            --max-num-seqs 8
            --max-num-batched-tokens 16384
            --enable-prefix-caching
            --enable-chunked-prefill
            --reasoning-parser qwen3
            --enable-auto-tool-choice
            --tool-call-parser qwen3_xml
            --default-chat-template-kwargs '{"enable_thinking": false, "add_generation_prompt": true, "continue_generation": false}'
            --speculative-config '{"method": "mtp", "num_speculative_tokens": 3, "moe_backend": "triton"}'
            --trust-remote-code
            --quantization compressed-tensors
            --dtype auto
        runtime: nvidia
        << : *deploy_nvidia
        networks:
          - backbone

    ### https://huggingface.co/ilessio-aiflowlab/Qwen2.5-Coder-14B-Instruct-NVFP4-anima
    vllm_qwen25_14b_coder:
        image: vllm/vllm-openai:v0.27.1-aarch64-ubuntu2404
        container_name: vllm_qwen25_14b_coder
        restart: unless-stopped
        pull_policy: always
        environment:
          - TZ=Europe/Berlin
          - HF_TOKEN=${HF_TOKEN}
        labels:
          - "traefik.enable=false"
        volumes:
          - ~/docker/vllm/models:/root/.cache/huggingface
          - ~/docker/vllm/cache/qwen_coder_14b:/root/.cache/vllm
        shm_size: '16gb'
        ports:
          - 8001:8001
        healthcheck:
            test: ["CMD-SHELL", "python3 -c \"import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8001/v1/models', timeout=5)); sys.exit(0 if isinstance(d, dict) and 'data' in d else 1)\" >/dev/null 2>&1 || exit 1"]
            interval: 20s
            timeout: 5s
            retries: 10
            start_period: 20m
        entrypoint: ["bash", "-c"]
        command:
          - >-
            exec vllm serve ilessio-aiflowlab/Qwen2.5-Coder-14B-Instruct-NVFP4-anima
            --served-model-name qwen2.5-coder
            --port 8001
            --kv-cache-dtype fp8
            --gpu-memory-utilization 0.40
            --max-model-len 32768
            --max-num-seqs 8
            --max-num-batched-tokens 32768
            --enable-prefix-caching
            --enable-chunked-prefill
            --trust-remote-code
            --quantization compressed-tensors
            --dtype auto
        runtime: nvidia
        << : *deploy_nvidia
        networks:
          - backbone

    ### Dedicated routing classifier
    ### https://huggingface.co/kaitchup/Qwen3-1.7B-NVFP4
    vllm_routing_classifier:
        image: vllm/vllm-openai:v0.27.1-aarch64-ubuntu2404
        container_name: vllm_routing_classifier
        restart: unless-stopped
        pull_policy: always
        environment:
          - TZ=Europe/Berlin
          - HF_TOKEN=${HF_TOKEN}
        labels:
          - "traefik.enable=false"
        volumes:
          - ~/docker/vllm/models:/root/.cache/huggingface
          - ~/docker/vllm/cache/routing_classifier:/root/.cache/vllm
        shm_size: '8gb'
        ports:
          - 8002:8002
        healthcheck:
            test: ["CMD-SHELL", "python3 -c \"import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8002/v1/models', timeout=5)); sys.exit(0 if isinstance(d, dict) and 'data' in d else 1)\" >/dev/null 2>&1 || exit 1"]
            interval: 20s
            timeout: 5s
            retries: 10
            start_period: 10m
        entrypoint: ["bash", "-c"]
        command:
          - >-
            exec vllm serve kaitchup/Qwen3-1.7B-NVFP4
            --served-model-name qwen3-routing-classifier
            --port 8002
            --gpu-memory-utilization 0.08
            --max-model-len 8192
            --max-num-seqs 2
            --max-num-batched-tokens 2048
            --enable-prefix-caching
            --enable-chunked-prefill
            --default-chat-template-kwargs '{"enable_thinking": false, "add_generation_prompt": true, "continue_generation": false}'
            --trust-remote-code
            --quantization compressed-tensors
            --dtype auto
        runtime: nvidia
        << : *deploy_nvidia
        networks:
          - backbone

    ### Qwen3.8 dense vision-language model with Unsloth Dynamic NVFP4
    ### Requires vLLM >= 0.25.0 and NVIDIA Blackwell (Jetson AGX Thor)
    ### https://huggingface.co/unsloth/Qwen3.8-27B-NVFP4
    ### https://unsloth.ai/docs/models/qwen3.8
    vllm_qwen38_27b:
        image: vllm/vllm-openai:v0.28.0-aarch64-ubuntu2404
        container_name: vllm_qwen38_27b
        restart: unless-stopped
        pull_policy: always
        environment:
          - TZ=Europe/Berlin
          - HF_TOKEN=${HF_TOKEN}
        labels:
          - "traefik.enable=false"
        volumes:
          - ~/docker/vllm/models:/root/.cache/huggingface
          - ~/docker/vllm/cache/qwen38_27b:/root/.cache/vllm
        shm_size: '16gb'
        expose:
          - 8000
        healthcheck:
            test: ["CMD-SHELL", "python3 -c \"import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000 /v1/models', timeout=5)); sys.exit(0 if isinstance(d, dict) and 'data' in d else 1)\" >/dev/null 2>&1 || exit 1"]
            interval: 20s
            timeout: 5s
            retries: 10
            start_period: 20m
        entrypoint: ["bash", "-c"]
        command:
          - >-
            exec vllm serve unsloth/Qwen3.8-27B-NVFP4
            --served-model-name qwen3.8
            --port 8000
            --kv-cache-dtype fp8
            --gpu-memory-utilization 0.5
            --max-model-len 262144
            --max-num-seqs 6
            --max-num-batched-tokens 16384
            --enable-prefix-caching
            --enable-chunked-prefill
            --reasoning-parser qwen3
            --enable-auto-tool-choice
            --tool-call-parser qwen3_xml
            --speculative-config '{"method": "mtp", "num_speculative_tokens": 3}'
            --trust-remote-code
            --quantization compressed-tensors
            --dtype auto
        runtime: nvidia
        << : *deploy_nvidia
        networks:
          - backbone

    ### NVIDIA Nemotron 3.5 Lightning 30B-A3B with DSpark speculation
    ### https://www.jetson-ai-lab.com/models/nemotron3-5-lightning/
    ### https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
    vllm_nemotron35:
        image: vllm/vllm-openai:v0.28.0-aarch64-ubuntu2404
        container_name: vllm_nemotron35
        restart: unless-stopped
        pull_policy: always
        environment:
          - TZ=Europe/Berlin
          - HF_TOKEN=${HF_TOKEN}
        labels:
          - "traefik.enable=false"
        volumes:
          - ~/docker/vllm/models:/root/.cache/huggingface
          - ~/docker/vllm/cache/nemotron35:/root/.cache/vllm
        shm_size: '16gb'
        expose:
          - 8000
        healthcheck:
            test: ["CMD-SHELL", "python3 -c \"import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5)); sys.exit(0 if isinstance(d, dict) and 'data' in d else 1)\" >/dev/null 2>&1 || exit 1"]
            interval: 20s
            timeout: 5s
            retries: 10
            start_period: 20m
        entrypoint: ["bash", "-c"]
        command:
          - >-
            exec vllm serve nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
            --served-model-name nemotron35
            --port 8000
            --reasoning-parser nemotron_v3
            --enable-auto-tool-choice
            --tool-call-parser qwen3_coder
            --max-model-len 128000
            --gpu-memory-utilization 0.4
            --kv-cache-dtype fp8
            --max-num-seqs 6
            --max-num-batched-tokens 16384
            --enable-prefix-caching
            --enable-chunked-prefill
            --speculative-config '{"method": "dspark", "model": "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark", "num_speculative_tokens": 5}'
            --mamba-backend flashinfer
            --mamba-ssm-cache-dtype float16
            --enable-mamba-cache-stochastic-rounding
            --mamba-cache-philox-rounds 5
            --mamba-cache-mode align
            --trust-remote-code
            --dtype auto
        runtime: nvidia
        << : *deploy_nvidia
        networks:
          - backbone

    litellm_router:
        image: python:3.12-slim
        container_name: litellm_router
        restart: unless-stopped
        working_dir: /app
        environment:
          - TZ=Europe/Berlin
          - APP_HOST=0.0.0.0
          - APP_PORT=4000
          - LOG_LEVEL=${LOG_LEVEL:-INFO}
          - LITELLM_CONFIG_PATH=/app/litellm_config.yaml
          - REQUEST_TIMEOUT_SEC=${REQUEST_TIMEOUT_SEC:-180}
          - ENABLE_RULE_ROUTER=${ENABLE_RULE_ROUTER:-true}
          - ENABLE_LLM_ROUTER=${ENABLE_LLM_ROUTER:-true}
          - ROUTER_CLASSIFIER_MAX_TOKENS=${ROUTER_CLASSIFIER_MAX_TOKENS:-8}
          - ROUTER_CLASSIFIER_TEMPERATURE=${ROUTER_CLASSIFIER_TEMPERATURE:-0}
          - CLASSIFIER_MODEL=${CLASSIFIER_MODEL:-openai/qwen3-routing-classifier}
          - CLASSIFIER_API_BASE=${CLASSIFIER_API_BASE:-http://vllm_routing_classifier:8002/v1}
          - CLASSIFIER_API_KEY=${CLASSIFIER_API_KEY:-sk-local}
          - LLM_AUDIT_LOG=${LLM_AUDIT_LOG:-true}
          - LLM_AUDIT_LOG_PATH=${LLM_AUDIT_LOG_PATH:-/app/logs/llm-requests.jsonl}
          - LLM_AUDIT_LOG_MAX_CHARS=${LLM_AUDIT_LOG_MAX_CHARS:-100000}
          - LLM_AUDIT_LOG_MAX_BYTES=${LLM_AUDIT_LOG_MAX_BYTES:-52428800}
          - GENERAL_MODEL=${GENERAL_MODEL:-openai/qwen3.6}
          - GENERAL_API_BASE=${GENERAL_API_BASE:-http://vllm_qwen36_27b:8000/v1}
          - GENERAL_API_KEY=${GENERAL_API_KEY:-sk-local}
          - CODER_MODEL=${CODER_MODEL:-openai/qwen2.5-coder}
          - CODER_API_BASE=${CODER_API_BASE:-http://vllm_qwen25_14b_coder:8001/v1}
          - CODER_API_KEY=${CODER_API_KEY:-sk-local}
          - QWEN38_MODEL=${QWEN38_MODEL:-openai/qwen3.8}
          - QWEN38_API_BASE=${QWEN38_API_BASE:-http://vllm_qwen38_27b:8000/v1}
          - QWEN38_API_KEY=${QWEN38_API_KEY:-sk-local}
          - NEMOTRON35_MODEL=${NEMOTRON35_MODEL:-openai/nemotron35}
          - NEMOTRON35_API_BASE=${NEMOTRON35_API_BASE:-http://vllm_nemotron35:8000/v1}
          - NEMOTRON35_API_KEY=${NEMOTRON35_API_KEY:-sk-local}
          - EXPOSED_GENERAL_NAME=${EXPOSED_GENERAL_NAME:-general}
          - EXPOSED_CODER_NAME=${EXPOSED_CODER_NAME:-coder}
          - EXPOSED_CLASSIFIER_NAME=${EXPOSED_CLASSIFIER_NAME:-classify}
          - EXPOSE_GENERAL=${EXPOSE_GENERAL:-false}
          - EXPOSE_CODER=${EXPOSE_CODER:-false}
          - EXPOSE_CLASSIFIER=${EXPOSE_CLASSIFIER:-false}
          - ROUTER_KEYWORDS=${ROUTER_KEYWORDS:-}
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.dontuse.entrypoints=dontuse"
          - "traefik.docker.network=proxy"
        volumes:
          - ~/docker/docker/vllm/litellm-gateway/router.py:/app/router.py:ro
          - ~/docker/docker/vllm/litellm-gateway/requirements.txt:/app/requirements.txt:ro
          - ~/docker/docker/vllm/litellm-gateway/litellm_config.yaml:/app/litellm_config.yaml:ro
          - ~/docker/vllm/litellm-gateway/logs:/app/logs
        command: >-
          sh -c "pip install --no-cache-dir -r /app/requirements.txt &&
          uvicorn router:app --host 0.0.0.0 --port 4000"
        expose:
          - "4000"
        networks:
          - proxy
          - backbone
        healthcheck:
          test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/healthz', timeout=5)\""]
          interval: 20s
          timeout: 5s
          retries: 5
          start_period: 30s

    ### https://huggingface.co/nvidia/MiniMax-M3-NVFP4
    ### https://huggingface.co/s-batman/Ornith-1.0-35B-NVFP4-MTP-GGUF
