###
### junand 10.10.2025
### containerized AI services for Nvidia Jetson AGX Thor 128GB

# ai/docker-compose.yaml

x-deploy_nvidia: &deploy_nvidia
    deploy:
        resources:
            reservations:
                devices:
                  - driver: nvidia
                    count: all
                    capabilities:
                      - gpu
                      - utility
                      - compute

### Wyoming Piper Containers
### https://github.com/dusty-nv/jetson-containers/tree/master/packages/smart-home/wyoming/wyoming-piper
###
x-piper-jetson: &piper_jetson
    image: dustynv/wyoming-piper:master-r36.2.0

x-piper-wsl2: &piper_wsl2
    image: wyoming-piper-gpu
    build:
      context: ./wyoming-piper-gpu

x-piper: &piper_container
    container_name: piper
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - PIPER_VOICE=de_DE-thorsten-high
    labels:
      - "traefik.enable=false"
    volumes:
      - ~/docker/piper/data:/data
    ports:
      - "10201:10200"
    runtime: nvidia
    << : *deploy_nvidia

x-whisper-jetson: &whisper_jetson
    image: dustynv/wyoming-whisper:latest-r36.2.0
    volumes:
      - ~/docker/whisper/models:/share/whisper
      - ~/docker/whisper/data:/data

# https://community.home-assistant.io/t/whisper-on-gpu/903694
x-whisper-wsl2: &whisper_wsl2
    image: lscr.io/linuxserver/faster-whisper:gpu
    volumes:
      - ~/docker/whisper/data:/config
      - ~/docker/whisper/run:/etc/s6-overlay/s6-rc.d/svc-whisper/run

x-whisper: &whisper_container
    container_name: whisper
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - PUID=1000
      - PGID=1000
      - WHISPER_MODEL=large-v3
      - WHISPER_LANG=de
      - WHISPER_BEAM=20
      - LOG_LEVEL=DEBUG
    labels:
      - "traefik.enable=false"
    ports:
      - 10300:10300
      - 10300:10300/tcp
    # network_mode: host
    runtime: nvidia
    << : *deploy_nvidia

services:

    ollama-wsl2:
        image: ${DOCKER_REGISTRY}dustynv/ollama:0.6.8-r36.4-cu126-22.04
        container_name: ollama-wsl2
        restart: unless-stopped
        environment:
          - TZ=Europe/Berlin
          - OLLAMA_NO_CLOUD=1
          - OLLAMA_LOG_LEVEL=debug
          - OLLAMA_MODELS=/root/.ollama/models
          - JETSON_JETPACK=6
        labels:
          - "traefik.enable=false"
        volumes:
          - ~/docker/ollama:/root/.ollama  # Persistente Speicherung der Modelle
          - ~/docker/docker/ai/start_ollama_and_idle.sh:/opt/start_ollama_and_idle.sh
        ports:
          - "11434:11434"  # Standard-Port für die API
        # entrypoint: ["/opt/start_ollama_and_idle.sh"]
        runtime: nvidia
        << : *deploy_nvidia

    ollama-nano:
        image: ${DOCKER_REGISTRY}dustynv/ollama:0.6.8-r36.4-cu126-22.04
        container_name: ollama-nano
        restart: unless-stopped
        environment:
          - TZ=Europe/Berlin
          - OLLAMA_NO_CLOUD=1
          - OLLAMA_LOG_LEVEL=debug
          - OLLAMA_MODELS=/root/.ollama/models
          - JETSON_JETPACK=6
        labels:
          - "traefik.enable=false"
        volumes:
          - ~/docker/ollama:/root/.ollama  # Persistente Speicherung der Modelle
          - ~/docker/docker/ai/start_ollama_and_idle.sh:/opt/start_ollama_and_idle.sh
        ports:
          - "11434:11434"  # Standard-Port für die API
        entrypoint: ["/opt/start_ollama_and_idle.sh"]
        runtime: nvidia
        << : *deploy_nvidia

    ollama-thor:
        image: ollama:r39.1.arm64-sbsa-cu132-24.04-ollama
        container_name: ollama-thor
        restart: unless-stopped
        environment:
          - TZ=Europe/Berlin
          - OLLAMA_NO_CLOUD=1
          - OLLAMA_LOG_LEVEL=debug
          - OLLAMA_MODELS=/root/.ollama/models
          - OLLAMA_MAX_LOADED_MODELS=5
          - OLLAMA_FLASH_ATTENTION=1
          - OLLAMA_KV_CACHE_TYPE=q8_0
          - OLLAMA_NUM_PARALLEL=2
          - OLLAMA_NUM_GPU_LAYERS=999
        labels:
          - "traefik.enable=false"
        volumes:
          - ~/docker/ollama:/root/.ollama  # Persistente Speicherung der Modelle
          - ~/docker/docker/ai/start_ollama_and_idle.sh:/opt/start_ollama_and_idle.sh
        ports:
          - "11434:11434"  # Standard-Port für die API
        entrypoint: ["/opt/start_ollama_and_idle.sh"]
        # runtime: nvidia
        # << : *deploy_nvidia

    whisper-jetson:
        container_name: whisper-jetson
        << : [*whisper_jetson, *whisper_container]

    whisper-wsl2:
        container_name: whisper-wsl2
        << : [*whisper_wsl2, *whisper_container]

    piper-jetson:
        container_name: piper-jetson
        << : [*piper_jetson, *piper_container]

    piper-wsl2:
        container_name: piper-wsl2
        << : [*piper_wsl2, *piper_container]

    ### vLLM OpenAI-compatible server
    ### https://www.jetson-ai-lab.com/models/
    ### https://docs.vllm.ai/en/stable/deployment/docker/

    ### https://huggingface.co/nvidia/Qwen3.6-27B-NVFP4
    ### https://www.jetson-ai-lab.com/models/qwen3-6-27b/
    ### https://catalog.ngc.nvidia.com/orgs/nvidia/-/containers/vllm/25.09-py3?_lr=1

    ### https://huggingface.co/sakamakismile/Qwen3.6-27B-NVFP4
    ### https://catalog.ngc.nvidia.com/orgs/nvidia/-/containers/vllm/26.05.post1-py3/tags
    ### https://docs.nvidia.com/deeplearning/frameworks/vllm-release-notes/rel-26-05.html#rel-26-05
    ### https://www.jetson-ai-lab.com/models/qwen3-6-27b/
    ### https://www.jetson-ai-lab.com/tutorials/genai-on-jetson-llms-vlms/
    ### https://github.com/orgs/NVIDIA-AI-IOT/packages

    # images
    #  >vllm/vllm-openai:v0.25.1-aarch64-ubuntu2404
    #   nvcr.io/nvidia/vllm:26.05.post1-py3
    #   ghcr.io/nvidia-ai-iot/vllm:0.19.0-r38.2.arm64-sbsa-cu130-24.04 -> passt nicht z r39
    # models
    #   sakamakismile/Qwen3.6-27B-NVFP4
    #  >nvidia/Qwen3.6-27B-NVFP4
    #   unsloth/qwen3.6-27b-nvfp4

    vllm_qwen36_27b:
        # image: vllm/vllm-openai:v0.26.0-aarch64-ubuntu2404
        image: vllm/vllm-openai:v0.25.1-aarch64-ubuntu2404
        container_name: vllm_qwen36_27b
        restart: unless-stopped
        pull_policy: always
        environment:
          - TZ=Europe/Berlin
          - HF_TOKEN=${HF_TOKEN}
        labels:
          - "traefik.enable=false"
        volumes:
          - ~/docker/vllm/models:/root/.cache/huggingface
          - ~/docker/vllm/cache/qwen36_27b:/root/.cache/vllm
        shm_size: '16gb'
        ports:
          - 8000:8000
        healthcheck:
            test: ["CMD-SHELL", "python3 -c \"import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5)); sys.exit(0 if isinstance(d, dict) and 'data' in d else 1)\" >/dev/null 2>&1 || exit 1"]
            interval: 20s
            timeout: 5s
            retries: 10
            start_period: 20m
        entrypoint: ["bash", "-c"]
        command:
          - >-
            exec vllm serve nvidia/Qwen3.6-27B-NVFP4
            --served-model-name qwen3.6
            --port 8000
            --kv-cache-dtype fp8
            --gpu-memory-utilization 0.6
            --max-model-len 262144
            --max-num-seqs 8
            --max-num-batched-tokens 16384
            --enable-prefix-caching
            --enable-chunked-prefill
            --reasoning-parser qwen3
            --enable-auto-tool-choice
            --tool-call-parser qwen3_xml
            --trust-remote-code
            --speculative-config '{"method": "mtp", "num_speculative_tokens": 3, "moe_backend": "triton"}'
            --quantization compressed-tensors
            --dtype auto
            --language-model-only
        runtime: nvidia
        << : *deploy_nvidia

    ### https://www.jetson-ai-lab.com/models/qwen3-6-35b-a3b/
    ### https://huggingface.co/RedHatAI/Qwen3.6-35B-A3B-NVFP4
    ### https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4
    vllm_qwen36_35b_a3b:
        image: vllm/vllm-openai:v0.25.1-aarch64-ubuntu2404
        container_name: vllm_qwen36_35b_a3b
        restart: unless-stopped
        pull_policy: always
        environment:
          - TZ=Europe/Berlin
          - HF_TOKEN=${HF_TOKEN}
          # - VLLM_MARLIN_USE_ATOMIC_ADD=1
          # - VLLM_NVFP4_GEMM_BACKEND=marlin
          # - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
        labels:
          - "traefik.enable=false"
        volumes:
          - ~/docker/vllm/models:/root/.cache/huggingface
          - ~/docker/vllm/cache/qwen36_35b_a3b:/root/.cache/vllm
        shm_size: '16gb'
        ports:
          - 8000:8000
        healthcheck:
            test: ["CMD-SHELL", "python3 -c \"import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5)); sys.exit(0 if isinstance(d, dict) and 'data' in d else 1)\" >/dev/null 2>&1 || exit 1"]
            interval: 20s
            timeout: 5s
            retries: 10
            start_period: 20m
        entrypoint: ["bash", "-c"]
            # --generation-config vllm
            # --language-model-only
        command:
          - >-
            exec vllm serve nvidia/Qwen3.6-35B-A3B-NVFP4
            --served-model-name qwen3.6
            --port 8000
            --kv-cache-dtype auto
            --gpu-memory-utilization 0.4
            --max-model-len 262144
            --max-num-seqs 8
            --max-num-batched-tokens 16384
            --enable-prefix-caching
            --enable-chunked-prefill
            --reasoning-parser qwen3
            --enable-auto-tool-choice
            --tool-call-parser qwen3_xml
            --default-chat-template-kwargs '{"enable_thinking": false, "add_generation_prompt": true, "continue_generation": false}'
            --speculative-config '{"method": "mtp", "num_speculative_tokens": 3, "moe_backend": "triton"}'
            --trust-remote-code
            --quantization compressed-tensors
            --dtype auto
        runtime: nvidia
        << : *deploy_nvidia

    ### https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
    ### https://www.jetson-ai-lab.com/models/nemotron-3-super/
    ###   256K context window, NVFP4 (E2M1 weights with FP8 block scales) for Blackwell FP4 Tensor Cores
    ### https://github.com/NVIDIA-NeMo/Nemotron/tree/main/usage-cookbook/Nemotron-3-Super/SparkDeploymentGuide
    vllm_nemotron3super:
        image: vllm/vllm-openai:v0.26.0-aarch64-ubuntu2404
        # image: vllm/vllm-openai:v0.23.0-aarch64-ubuntu2404
        container_name: vllm_nemotron3super
        restart: unless-stopped
        pull_policy: always
        environment:
          - TZ=Europe/Berlin
          - HF_TOKEN=${HF_TOKEN}
          # - VLLM_NVFP4_GEMM_BACKEND=marlin
          - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
          - VLLM_FLASHINFER_ALLREDUCE_BACKEND=trtllm
          # - VLLM_USE_FLASHINFER_MOE_FP4=0
        labels:
          - "traefik.enable=false"
        volumes:
          - ~/docker/vllm/models:/root/.cache/huggingface
          # Persistenter torch.compile / CUDA-Graph Cache → spart ab dem 2. Start die komplette Kompilierung
          - ~/docker/vllm/cache/nemotron_3_super:/root/.cache/vllm
          # wget https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4/raw/main/super_v3_reasoning_parser.py
          - ~/docker/vllm/reasoning_parser/super_v3_reasoning_parser.py:/app/super_v3_reasoning_parser.py
        # ipc: host
        # shm_size: '8gb'
        ports:
          - 8000:8000
        healthcheck:
          test: ["CMD-SHELL", "python3 -c \"import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5)); sys.exit(0 if isinstance(d, dict) and 'data' in d else 1)\" >/dev/null 2>&1 || exit 1"]
          interval: 20s
          timeout: 5s
          retries: 10
          start_period: 20m
        entrypoint: ["bash", "-c"]
        command:
          - >-
            exec vllm serve nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
            --port 8000
            --served-model-name nemotron-3-super
            --generation-config vllm
            --async-scheduling
            --dtype auto
            --max-model-len 262144
            --trust-remote-code
            --kv-cache-dtype fp8
            --kv-cache-memory 31496807732
            --max-cudagraph-capture-size 128
            --enable-chunked-prefill
            --moe-backend marlin
            --mamba-ssm-cache-dtype float32
            --quantization fp4
            --tensor-parallel-size 1
            --max-num-seqs 4
            --max-num-batched-tokens 8192
            --speculative-config '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
            --reasoning-parser-plugin /app/super_v3_reasoning_parser.py
            --reasoning-parser super_v3
            --enable-auto-tool-choice
            --tool-call-parser qwen3_coder
        runtime: nvidia
        << : *deploy_nvidia

