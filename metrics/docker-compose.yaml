# metrics/docker-compose.yaml

networks:

    proxy:
        external: true

    metrics:
        external: true

    backbone:
        external: true

services:

    prometheus:
        image: ${DOCKER_REGISTRY}prom/prometheus
        container_name: prometheus
        restart: ${DOCKER_RESTART_POLICY}
        environment:
          - TZ=Europe/Berlin
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.dontuse.entrypoints=dontuse"
          - "traefik.docker.network=metrics"
        depends_on:
          - cadvisor
          - node-exporter
        volumes:
          - "~/docker/prometheus/data:/prometheus"
          - "~/docker/docker/metrics/prometheus.yaml:/etc/prometheus/prometheus.yml"
        networks:
          - metrics

    cadvisor:
        image: ${DOCKER_REGISTRY}zcube/cadvisor
        container_name: cadvisor
        restart: ${DOCKER_RESTART_POLICY}
        environment:
          - TZ=Europe/Berlin
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.dontuse.entrypoints=dontuse"
          - "traefik.docker.network=metrics"
        volumes:
          - "/:/rootfs:ro"
          - "/var/run:/var/run:rw"
          - "/sys:/sys:ro"
          - "/var/lib/docker/:/var/lib/docker:ro"
          - "/dev/disk/:/dev/disk:ro"
        networks:
          - metrics

    node-exporter:
        image: ${DOCKER_REGISTRY}prom/node-exporter
        command: "--collector.textfile.directory=/data"
        container_name: node-exporter
        restart: ${DOCKER_RESTART_POLICY}
        environment:
          - TZ=Europe/Berlin
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.dontuse.entrypoints=dontuse"
          - "traefik.docker.network=metrics"
        volumes:
          - "/var/lib/node_exporter/textfile_collector:/data"
        networks:
          - metrics
